name: CI/CD — XIVIZLEY Suite

on:
  push:
    branches: [main, ghcr-pipeline]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & GHCR Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Build hub (Next.js)
        run: pnpm --filter @xivizley/sso build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Hub Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/sso/Dockerfile
          push: true
          tags: |
            ghcr.io/xivizley/xivizley-suite-hub:latest
            ghcr.io/xivizley/xivizley-suite-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VDS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ghcr-pipeline'
    steps:
      - name: SSH Deploy & Verified Health Rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          port: ${{ secrets.VDS_PORT }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            cd /opt/xivizley-suite

            # 1. Mevcut imaj ID'sini rollback için etiketle
            PREV_IMAGE_ID=$(docker inspect --format='{{.Image}}' xivizley-hub 2>/dev/null || echo "")
            if [ -n "$PREV_IMAGE_ID" ]; then
              docker tag "$PREV_IMAGE_ID" xivizley-hub-prev:rollback
              echo "Mevcut imaj yedeklendi: xivizley-hub-prev:rollback ($PREV_IMAGE_ID)"
            fi

            # 2. Kod ve compose dosyalarını güncelle
            TARGET_BRANCH="${{ github.ref_name }}"
            git fetch origin --quiet
            git checkout "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            cd deploy

            # 3. Hazır GHCR imajını çek ve ayağa kaldır (fallback destekli)
            echo "Pulling GHCR pre-built image..."
            if ! docker compose pull hub; then
              echo "⚠️ GHCR pull başarısız oldu, yerel build devrede..."
              docker compose up -d --build --wait hub
            else
              docker compose up -d --wait hub
            fi

            # 4. Uçtan Uca Sağlık Doğrulaması (Caddy TLS arkasından)
            echo "Testing end-to-end health at https://suite.xivizley.com.tr/api/health..."
            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -sf https://suite.xivizley.com.tr/api/health >/dev/null 2>&1; then
                HEALTHY=1
                echo "🟢 Canlı servis uçtan uca sağlıklı (deneme $i)!"
                break
              fi
              sleep 2
            done

            # 5. Sağlık testi başarısızsa Rollback
            if [ "$HEALTHY" -ne 1 ]; then
              echo "🚨 SAĞLIK KONTROLÜ BAŞARISIZ! Acil Rollback yapılıyor..."
              if docker image inspect xivizley-hub-prev:rollback >/dev/null 2>&1; then
                echo "Önceki yedeklenen imaja dönülüyor: xivizley-hub-prev:rollback"
                HUB_IMAGE=xivizley-hub-prev:rollback docker compose up -d --force-recreate hub
                echo "⚠️ Rollback başarılı. Canlı servis korundu."
              fi
              exit 1
            fi

            # 6. Başarılı olduysa dangling temizliği yap
            docker image prune -f >/dev/null 2>&1 || true
            echo "Deploy OK: $(git -C /opt/xivizley-suite rev-parse --short HEAD)"
