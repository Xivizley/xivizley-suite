name: CI/CD — XIVIZLEY Suite

on:
  push:
    branches: [main, ghcr-pipeline]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & GHCR Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Build hub (Next.js)
        run: pnpm --filter @xivizley/sso build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Hub Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/sso/Dockerfile
          push: true
          tags: |
            ghcr.io/xivizley/xivizley-suite-hub:latest
            ghcr.io/xivizley/xivizley-suite-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VDS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ghcr-pipeline'
    steps:
      - name: SSH Deploy & Verified Health Rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          port: ${{ secrets.VDS_PORT }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            cd /opt/xivizley-suite
            TARGET_BRANCH="${{ github.ref_name }}"
            git fetch origin --quiet
            git checkout "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            chmod +x scripts/deploy-vds.sh
            bash scripts/deploy-vds.sh
